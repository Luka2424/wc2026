name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into HTML
        env:
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
        run: |
          python3 -c "
import os, re
key = os.environ['JSONBIN_API_KEY']
pin = os.environ['ADMIN_PIN']
with open('index.html', 'r') as f:
    content = f.read()
content = content.replace('__JSONBIN_API_KEY__', key)
content = content.replace('__ADMIN_PIN__', pin)
with open('index.html', 'w') as f:
    f.write(content)
print('Injected key prefix:', key[:8])
print('Injected pin length:', len(pin))
"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,*.yml'
